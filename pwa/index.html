  :root{
    --bg:#151009; --card:#17211c; --card2:#233229; --line:#2b3a31;
    --text:#e8f0ea; --dim:#8fa398; --accent:#9db4f0; --accent2:#e8c468;
    --blue:#85b9ea; --white-tee:#e8f0ea; --gold:#ffc72c; --red:#fb637e;
    --water:#3a6ea5; --sand:#f0dfb8; --green-fill:#1fee75;
    --cl:#4a5c51; --green-stroke:#6bff96; --fcb:#cfe8d5; --chiptext:#0e1512;
    --topo:#4db3f5; --topo-index:#8ad4ff; --centertint:#1b2734;
  }
  /* SUN MODE — max contrast for direct sunlight */
  body.sun{
    --bg:#f2e7cf; --card:#ffffff; --card2:#eff5ea; --line:#c9c2b2;
    --text:#111111; --dim:#4a4a42; --accent:#4a5fae; --accent2:#b45309;
    --blue:#4d84c4; --white-tee:#cfd4da; --gold:#ffc72c; --red:#fb637e;
    --water:#1e4d8c; --sand:#e8c878; --green-fill:#17d562;
    --cl:#6b6555; --green-stroke:#43f976; --fcb:#ffffff; --chiptext:#ffffff;
    --topo:#5aa8f0; --topo-index:#1f6fe0; --centertint:#e9f1fb;
  }
  body.sun .tees button.sel.White{color:#111}
  body.sun .dist .val{font-weight:900}
  /* DREAM MODE — surreal night theme */
  body.dream{
    --bg:#170b2e; --card:#131338; --card2:#212158; --line:#2b2b5e;
    --text:#e6e6ff; --dim:#9a9ac4; --accent:#aca7fa; --accent2:#e879f9;
    --blue:#9daafa; --white-tee:#cdd3f5; --gold:#ffc72c; --red:#fb637e;
    --water:#4c6ef5; --sand:#ecdff8; --green-fill:#09fdb8;
    --cl:#5b5b9e; --green-stroke:#6cffd1; --fcb:#ffffff; --chiptext:#0b0b2a;
    --topo:#4de0ff; --topo-index:#b088ff; --centertint:#1d2a66;
  }
  body.dream #map .ctr{stroke-dasharray:5 9;animation:ctrflow 7s linear infinite}
  body.dream #map .ctr.idx{stroke-dasharray:10 6;animation:ctrflowi 11s linear infinite}
  @keyframes ctrflow{to{stroke-dashoffset:-56px}}
  @keyframes ctrflowi{to{stroke-dashoffset:-48px}}
  body.dream #map .greenp{animation:dreampulse 4s ease-in-out infinite}
  @keyframes dreampulse{0%,100%{fill-opacity:.75}50%{fill-opacity:1}}
  body.dream #map .star{animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.9}}
  /* flowing shoreline ripples on water (all themes) */
  #map .ripple{stroke-dasharray:4 7;stroke-linecap:round;animation:rippleflow 8s linear infinite}
  @keyframes rippleflow{to{stroke-dashoffset:-44px}}
  /* "my ball" marker: hot gold glow + pulsing halo ring around the player position */
  #map .you-pulse{transform-box:fill-box;transform-origin:center;animation:youpulse 2.2s ease-out infinite}
  @keyframes youpulse{0%{transform:scale(.6);opacity:.9}70%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
  #map .you-glow{transform-box:fill-box;transform-origin:center;animation:youglow 1.4s ease-in-out infinite alternate}
  @keyframes youglow{from{transform:scale(.85);opacity:.75}to{transform:scale(1.15);opacity:1}}
  #map .you-search{transform-box:fill-box;transform-origin:center;animation:yousearch 2.4s ease-in-out infinite alternate}
  @keyframes yousearch{from{transform:scale(.8);opacity:.55}to{transform:scale(1.25);opacity:1}}
  /* loading burgee: pole raises, pennant unfurls from the mast, then flutters */
  #map .burgee-load{animation:burgeeRaise .5s ease-out both}
  @keyframes burgeeRaise{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
  #map .burgee-wave{animation:burgeeUnfurl .7s .35s ease-out both, burgeeFlutter 2.6s 1.05s ease-in-out infinite}
  @keyframes burgeeUnfurl{from{transform:scaleX(.04)}to{transform:scaleX(1)}}
  @keyframes burgeeFlutter{0%,100%{transform:skewY(0deg) scaleX(1)}25%{transform:skewY(-2.2deg) scaleX(.985)}60%{transform:skewY(2.6deg) scaleX(1.01)}}
  /* weather flourishes — real sky over the course */
  #map .wx-mist{animation:wxmist 9s ease-in-out infinite}
  @keyframes wxmist{0%,100%{opacity:.08}50%{opacity:.2}}
  #map .wx-rain line{animation:wxrain 1.1s linear infinite}
  @keyframes wxrain{from{transform:translateY(-6px);opacity:0}20%{opacity:.6}to{transform:translateY(10px);opacity:0}}
  #map .wx-flake{animation:wxflake 4s ease-in-out infinite}
  @keyframes wxflake{from{transform:translateY(-4px);opacity:0}30%{opacity:.9}to{transform:translateY(12px);opacity:0}}
  body.dream .dist .val{color:var(--accent);text-shadow:0 0 14px rgba(110,231,255,.75)}
  body.dream .dist .box.center .val{text-shadow:0 0 18px rgba(110,231,255,.9)}
  #d3ex{width:110px;accent-color:var(--accent)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
  #confetti b{position:absolute;top:-24px;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8);box-shadow:inset -2px -2px 3px rgba(0,0,0,.3);
    animation:balldrop 3.6s cubic-bezier(.3,.4,.6,1) forwards}
  @keyframes balldrop{to{transform:translateY(112vh) rotate(720deg)}}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;user-select:none;-webkit-user-select:none}
  #app{max-width:480px;margin:0 auto;padding:2px 12px 24px}

  header{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
  header h1{font-family:'EB Garamond',Garamond,Baskerville,'Times New Roman',serif;
    font-weight:500;text-transform:uppercase;line-height:1;text-align:left}
  header h1 .h1a{display:block;font-size:28.8px;letter-spacing:1.6px}
  header h1 .h1b{display:block;font-size:16px;letter-spacing:1.4px;margin-top:3px}
  header .sub{font-size:11px;color:var(--dim)}
  #tagline{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}
  #pname{font-family:'EB Garamond',Garamond,Baskerville,'Times New Roman',serif;font-style:italic;
    font-weight:500;font-size:14px;color:var(--text);cursor:pointer;padding:4px 6px 4px 12px;
    letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  #pname.unset{color:var(--dim);opacity:.75}
  #tagline a{display:inline-block;font-family:'EB Garamond',Garamond,Baskerville,'Times New Roman',serif;
    font-weight:500;font-style:italic;font-size:13.5px;color:#3a2405;text-decoration:none;
    background:linear-gradient(135deg,#fbe9b8 0%,#f6d47c 55%,#eeb86a 100%);
    border:1px solid rgba(185,135,60,.35);border-radius:999px;
    padding:4px 18px;letter-spacing:.4px;line-height:1.3;
    box-shadow:0 1px 3px rgba(220,160,80,.18);transform:translateY(-8px)}
  #tagline a:active{background:linear-gradient(135deg,#f6dd9a,#e5a95c)}

  :root{--brightblue:#00a9e0}   /* PMS 306 — the app's bright blue: CARD, Bear's Log */

  .holebar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .holebar button{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:10px;font-size:20px;width:46px;height:46px;cursor:pointer}
  .holebar button:active{background:var(--card2)}
  .holeinfo{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
    height:46px;display:flex;align-items:center;justify-content:center;gap:14px}
  .holeinfo .num{font-size:27px;font-weight:800;white-space:nowrap}
  .holeinfo .meta{font-size:12px;color:var(--dim);line-height:1.25;text-align:left}
  /* CARD lives on the hole bar now — the scoring strip needed the whole width.
     Same 46px footprint the AUTO button had; carries the running total so it stays visible. */
  #scTot{display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1;padding:0;font-size:13px;font-weight:900;letter-spacing:.8px;
    color:var(--brightblue);border-color:var(--brightblue);cursor:pointer}
  /* the word and nothing else. Total and holes-played are still kept up to date
     underneath (2026-07-28) — delete these two rules to put either back. */
  #scTot b{display:none}
  #scTot #scThru{display:none}

  .tees{display:flex;gap:6px;margin-bottom:10px}
  .tees button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer}
  .tees button.sel{color:var(--chiptext);border-color:transparent}
  #sunBtn,#helpBtn{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;line-height:1;flex-shrink:0}
  #helpBtn{font-family:var(--serif,'EB Garamond',Garamond,serif);font-weight:700;color:var(--accent);font-size:17px}
  .tees button.sel.Blue{background:var(--blue)} .tees button.sel.White{background:var(--white-tee)}
  .tees button.sel.Gold{background:var(--gold);color:#161616} .tees button.sel.Red{background:var(--red);color:#fff}
  .tees button.sel.Green{background:#7fe0a8;color:#0e1512}

  #holeMemory{display:none;text-align:center;font-family:'EB Garamond',Garamond,Baskerville,serif;font-style:italic;
    font-size:14px;color:var(--dim);margin:1px 0 8px;letter-spacing:.2px;line-height:1.3}
  #holeMemory.on{display:block}
  #holeMemory.good{color:#d63ba8}
  .dist{display:flex;gap:8px;margin-bottom:10px}
  .dist .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 4px;text-align:center}
  /* the CENTER box used to borrow --card2, which is tinted green to match the
     terrain. Its own cool blue tint now, so the hero number sits on blue. */
  .dist .box.center{background:var(--centertint);border-color:var(--accent)}
  .dist .lbl{font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:600}
  .dist .val{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
  .dist .box.center .val{font-size:44px;color:var(--accent)}
  .dist .plays{font-size:11px;font-weight:700;color:var(--accent2);min-height:14px}
  body.sun .dist .plays{color:#1b3a66}   /* dark blue on the daytime center box (was brown) */

  #mapwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin-bottom:10px;overflow:hidden;position:relative;touch-action:pan-y}
  #mapbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
  #shotbar{position:absolute;bottom:22px;left:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
  #shotbar select{background:rgba(10,16,12,.62);color:#fff;border:2px solid #35c8ff;border-radius:7px;
    padding:6px 7px;font-size:13px;font-weight:900;letter-spacing:1.2px;backdrop-filter:blur(2px)}
  #shotbar button{background:rgba(10,16,12,.62);color:#fff;border:2px solid var(--accent2);border-radius:7px;
    padding:6px 12px;font-size:13px;font-weight:900;letter-spacing:.6px;cursor:pointer;backdrop-filter:blur(2px);transition:background .12s,border-color .12s,color .12s}
  #shotbar button.marking{background:#12d17a;border-color:#0aa860;color:#04150c;animation:shotflash .5s ease-out}
  @keyframes shotflash{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
  body.sun #shotbar select, body.sun #shotbar button{background:rgba(255,255,255,.75);color:#111}
  #mapbtns button{background:rgba(10,16,12,.55);color:#fff;border:2px solid #35c8ff;border-radius:7px;
    padding:5px 9px;font-size:10px;font-weight:700;letter-spacing:.5px;cursor:pointer;backdrop-filter:blur(2px)}
  body.sun #mapbtns button{background:rgba(255,255,255,.75);color:#111}
  #mapbtns button.on{box-shadow:0 0 0 2px var(--accent)}
  /* a little flagstick behind the type — PIN is the one button whose job isn't obvious */
  #pinBtn{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6.6 22.5V2.2' stroke='%23ff2fd6' stroke-width='1.9' stroke-linecap='round' opacity='.55'/><path d='M6.6 2.6L18 6.1 6.6 9.7z' fill='%23ff2fd6' opacity='.5'/></svg>");
    background-repeat:no-repeat;background-position:center;background-size:auto 82%}
  /* ★ memories. Quiet at rest, unmistakable when armed.
     The loud version had a bug hiding inside it: the chip's border was white and
     the armed ring was ALSO white (0 0 0 3px #fff), so arming changed nothing you
     could see. Tapping it looked like a dead button. The state change is now a
     full inversion — dark star on gold — which is both the elegant resting look
     and the missing feedback. */
  #mapbtns #memBtn, body.sun #mapbtns #memBtn{
    font-size:14px;line-height:1.35;padding:3px 8px;
    background:#1638a8;border-color:rgba(236,178,72,.9)}
  #mapbtns #memBtn .star, body.sun #mapbtns #memBtn .star{
    display:inline-block;line-height:1;color:#ffd257;text-shadow:0 1px 1px rgba(0,0,0,.45)}
  /* armed: the chip fills, the star reverses out of it */
  #mapbtns #memBtn.on, body.sun #mapbtns #memBtn.on{
    background:linear-gradient(180deg,#ffd257 0%,#f2a413 100%);border-color:#fff1c9;
    box-shadow:0 0 0 2px rgba(242,164,19,.5),0 1px 4px rgba(0,0,0,.35)}
  #mapbtns #memBtn.on .star, body.sun #mapbtns #memBtn.on .star{
    color:#1638a8;text-shadow:0 1px 0 rgba(255,255,255,.6)}   /* burgee blue on the gold fill */
  #threeD{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
  #threeD.open{display:flex}
  #d3c{flex:1;touch-action:none;width:100%}
  #threeDbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
  #threeDbar span{font-size:13px;font-weight:700;letter-spacing:.5px}
  #threeDbar button{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer}
  #d3hint{text-align:center;font-size:10px;color:var(--dim);padding:8px}
  #map{display:block;width:100%;height:auto;max-height:66vh;margin:0 auto;touch-action:manipulation}
  #maphint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);pointer-events:none}
  .dist .box.center{cursor:pointer}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .panel h2{font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:600;margin-bottom:6px}
  .hazrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;
    border-bottom:1px solid var(--line);font-size:14px}

  .hazrow .ic{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:-2px}
  .ic.bunker{background:var(--sand)} .ic.water{background:var(--water)} .ic.dogleg{background:#f000c2;border-radius:50%}
  .hazrow .nums{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
  .hazrow .nums b{color:var(--text);font-size:15px;font-weight:700}

  /* ---- running scorecard ---- */
  /* two counters, full width, thumb-sized. Label stacks ABOVE the counter row so
     "TOTAL SCORE" can't squeeze the buttons on a narrow phone (the old bug). */
  #scstrip{display:flex;justify-content:space-around;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:10px}
  #scstrip .grp{display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:12.5px;font-weight:800;color:var(--text);letter-spacing:.5px}
  #scstrip .grp .ct{display:flex;align-items:center;gap:7px}
  #scstrip .grp b{font-size:44px;line-height:1;color:var(--text);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
  #scstrip button{width:46px;height:50px;border-radius:10px;border:1px solid var(--line);background:none;
    color:var(--text);font-size:27px;font-weight:700;cursor:pointer;flex:none;touch-action:manipulation}
  #scorecard{position:fixed;inset:0;background:#f2e9d6;z-index:60;display:none;flex-direction:column;padding:4px 12px 10px}
  #scorecard.open{display:flex}
  /* ---- My Bear's Log button (on the scorecard) ---- */
  /* burgee blue, sized to sit modestly under the card. min-width keeps a longer
     club's diary name from wrapping when the % goes narrow on a small phone. */
  #bearBtn{display:block;width:30%;min-width:118px;max-width:60%;margin:8px auto 2px;
    padding:10px 12px;border:none;border-radius:12px;white-space:nowrap;
    background:#1638a8;color:#fffdf7;font-family:'EB Garamond',Garamond,serif;font-style:italic;font-size:15px;
    letter-spacing:.4px;cursor:pointer;box-shadow:0 3px 10px rgba(22,56,168,.30)}
  #bearBtn:active{background:#102a80}
  /* ---- The Bear's Log keepsake overlay (fixed light design, theme-independent) ---- */
  #bearlog{position:fixed;inset:0;z-index:70;display:none;overflow:auto;background:#f2e7cf;
    -webkit-overflow-scrolling:touch;padding-top:calc(64px + env(safe-area-inset-top))}
  #bearlog.open{display:block}
  /* The bar was position:sticky inside this momentum-scrolling overlay, which on iOS
     can leave the sticky element's hit box behind its painted position while the
     scroll settles — so the close button looked tappable and intermittently wasn't.
     Fixed has no such failure mode, and the guide's close button (already fixed)
     has never misbehaved. 46px is also the first size that clears Apple's 44px. */
  #bearlog .bl-bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:rgba(242,231,207,.92);backdrop-filter:blur(6px);z-index:2}
  #bearlog .bl-bar button{border:1px solid #cdbf9e;background:#fffdf7;color:#1a1712;border-radius:999px;
    padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #bearlog .bl-bar button:active{background:#efe6d2}
  #bearlog .bl-bar .bl-x{width:46px;height:46px;padding:0;font-size:21px;border-radius:50%}
  #bearlog .bl-bar .bl-actions{display:flex;gap:8px}
  #bearlog .bl-bar #blShare{background:#1b3a66;color:#fffdf7;border-color:#1b3a66}
  #bearlog .bl-bar #blShare:active{background:#14305a}
  #bearlog .bl-page{max-width:620px;margin:0 auto 40px;background:#fffdf7;border:1px solid #e5dbc4;
    border-radius:18px;box-shadow:0 14px 42px rgba(60,45,20,.18);padding:22px 30px 26px;position:relative}
  #bearlog .bl-page:before{content:"";position:absolute;inset:9px;border:1px solid #ece2c9;border-radius:12px;pointer-events:none}

  #bearlog .bl-t{flex:1;min-width:0}
  #bearlog .bl-eyebrow{font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:#0e6b3a;font-weight:700;white-space:nowrap}
  #bearlog .bl-date{font-family:'EB Garamond',serif;font-weight:600;font-size:32px;margin:10px 0 0;line-height:1.05;color:#1a1712;white-space:nowrap}
  #bearlog .bl-who{font-family:'EB Garamond',serif;font-style:italic;font-size:16px;color:#6b6350;margin-top:12px}
  #bearlog .bl-cond{text-align:right;font-size:12.5px;color:#6b6350;line-height:1.55;white-space:nowrap;font-family:-apple-system,sans-serif;flex:none}
  #bearlog .bl-cond b{color:#1a1712;font-weight:700}
  #bearlog .bl-sec{font-family:'EB Garamond',serif;font-weight:600;font-size:18px;color:#1b3a66;margin:22px 0 9px}
  #bearlog .bl-box{border:1px solid #e5dbc4;border-radius:9px;overflow:hidden;margin:18px 0 6px;background:#fffdf7}
  #bearlog .bl-secbar{background:#a1d68b;color:#fffdf7;text-align:center;text-transform:uppercase;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px;font-weight:800;letter-spacing:2.5px;padding:7px 0}
  #bearlog .bl-box .bl-stk{margin:13px 0}
  /* the full collection, lined up small under each shelf */

  /* Collection minis are laid out with plain flex centering and NO auto margins or
     CSS filters on the SVG — html2canvas mis-measures `margin:0 auto` / filtered
     small inline SVGs and clips them to a sliver in the shared image. */

  #bearlog table.bl-hs .bl-lab{font-weight:800;color:#1b3a66;font-size:10.5px;letter-spacing:.5px;width:34px;background:#f4f9ff}
  #bearlog table.bl-hs .bl-par{color:#7a7362;font-weight:600}
  #bearlog table.bl-hs .bl-tot{font-weight:800;color:#1b3a66;background:#f4f9ff}
  #bearlog .bl-mk{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;font-weight:700;color:#1b3a66}
  #bearlog .bl-mk.bl-bird{border:1.7px solid #f000c2;border-radius:50%;color:#f000c2}
  #bearlog .bl-mk.bl-eagle{border:1.7px solid #f000c2;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3.4px #f000c2;color:#f000c2}
  #bearlog .bl-mk.bl-bog{border:1.7px solid #ffa300;border-radius:3px;color:#c9760a}
  #bearlog .bl-mk.bl-dbl{border:1.7px solid #ffa300;border-radius:3px;box-shadow:0 0 0 2px #fff,0 0 0 3.4px #ffa300;color:#c9760a}
  #bearlog .bl-cols{display:flex;gap:22px;margin:8px 0 4px;flex-wrap:wrap;align-items:flex-start}
  #bearlog .bl-moments{flex:1 1 300px;min-width:250px}
  #bearlog .bl-mom{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px dotted #e5dbc4;font-size:14px;line-height:1.45}
  #bearlog .bl-dot{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:1px}
  #bearlog .bl-map{flex:0 0 150px;text-align:center}
  #bearlog .bl-map svg{width:150px;height:auto;border-radius:12px}
  #bearlog .bl-map .bl-cap{font-family:'EB Garamond',serif;font-style:italic;font-size:12.5px;color:#6b6350;margin-top:6px}
  #bearlog .bl-note{margin:20px 0 6px;background:#fbe3f4;border-left:6px solid #f000c2;border-radius:0 10px 10px 0;
    padding:16px 22px;font-family:'EB Garamond',serif;font-style:italic;font-size:19px;color:#1a1712;line-height:1.5;cursor:pointer}
  #bearlog .bl-note.empty{color:#8a8270}
  #bearlog .bl-stk{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
  #bearlog .bl-seal{width:85px;text-align:center}   /* 3 across still fits a 286px column */
  #bearlog .bl-seal svg{display:block;margin:0 auto;filter:drop-shadow(0 3px 9px rgba(60,45,20,.16))}
  #bearlog .bl-seal .bl-scap{font-family:-apple-system,sans-serif;font-size:11px;font-weight:800;letter-spacing:.4px;margin-top:7px;text-transform:uppercase;color:#1638a8}
  /* the whole set, small and captionless — six across has to survive a ~310px column */
  #bearlog .bl-set{gap:8px;margin-top:14px;flex-wrap:nowrap}
  #bearlog .bl-set .bl-seal{width:auto}
  #bearlog .bl-set .bl-seal svg{filter:drop-shadow(0 2px 5px rgba(60,45,20,.16))}
  #bearlog .bl-hint{text-align:center;font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:#6b6350;margin:12px auto 0;max-width:440px}
  #bearlog .bl-bear{position:relative;font-family:'EB Garamond',serif;font-style:italic;font-size:18px;color:#1a1712;text-align:center;margin:22px 0 4px;line-height:1.5;background:#e4f5f3;border:1px solid #bfe3df;border-radius:14px;padding:22px 26px 15px}
  #bearlog .bl-bear:before{content:"\201C";position:absolute;top:2px;left:20px;font-family:'EB Garamond',serif;font-size:48px;line-height:1;color:#2fb0a8;opacity:.55}
  #bearlog .bl-bear .bl-sig{display:block;font-family:-apple-system,sans-serif;font-size:13px;color:#6b6350;margin-top:8px;font-style:normal;letter-spacing:1px}
  #bearlog .bl-foot{border-top:1px solid #e5dbc4;margin-top:20px;padding-top:12px;text-align:center;font-family:-apple-system,sans-serif;font-size:11px;color:#6b6350;letter-spacing:.6px}
  /* ---- keepsake on a phone ----
     The page was laid out at its 620px desktop max-width. The masthead needs
     ~567px of that (crest 212 + nowrap date 250 + nowrap conditions 94 + gaps)
     while a phone offers 260–370px, and .bl-t has min-width:0 — so the date,
     being nowrap, spilled straight off the right edge instead of wrapping.
     Below 560px the masthead stacks and every fixed width gives way. */
  @media(max-width:560px){
    #bearlog .bl-page{padding:18px 16px 22px;border-radius:14px}
    #bearlog .bl-page:before{inset:7px;border-radius:10px}
    #bearlog .bl-mast{flex-wrap:wrap;gap:2px}
    #bearlog .bl-mast img{width:170px;margin-top:-12px;margin-left:-18px}
    #bearlog .bl-eyebrow{white-space:normal}
    #bearlog .bl-date{font-size:26px;white-space:normal;margin-top:6px}
    #bearlog .bl-who{margin-top:6px}
    #bearlog .bl-cond{flex:1 1 100%;text-align:left;margin-top:6px}
    #bearlog .bl-band{flex-wrap:wrap;gap:8px}
    #bearlog .bl-score{font-size:52px}
    #bearlog .bl-chips{margin-left:0;justify-content:flex-start;width:100%}
    #bearlog table.bl-hs{font-size:11px}
    #bearlog table.bl-hs .bl-lab{width:30px;font-size:9.5px}
    #bearlog .bl-mk{width:20px;height:20px}
    #bearlog .bl-cols{gap:12px}
    #bearlog .bl-map{flex:1 1 100%}
    #bearlog .bl-map svg{width:100%;max-width:200px}
    #bearlog .bl-note{padding:14px 16px;font-size:17px}
    #bearlog .bl-bear{padding:24px 18px 16px;font-size:16.5px}
  }
  @media print{ body>*{display:none!important} #bearlog{display:block!important;position:static;background:#fff;padding-top:0!important} #bearlog .bl-bar{display:none!important} #bearlog .bl-page{box-shadow:none;border:none;margin:0} }
  #scbar{display:flex;justify-content:space-between;align-items:center;padding:0 2px 4px;position:relative;z-index:2;flex-wrap:wrap;gap:4px}
  #scbar>span:last-child{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;margin-left:auto}
  #scbar span{font-size:13px;font-weight:700;letter-spacing:.5px;color:#1b3a66}
  #scTitleWrap{display:flex;flex-direction:column;line-height:1.15}
  #scBrand{font-size:10px;font-weight:800;letter-spacing:1.4px}
  #scbar button{background:#ffffff;border:1px solid #cfc3a2;color:#1b3a66;border-radius:8px;
    padding:6px 9px;font-size:10.5px;font-weight:700;cursor:pointer;margin-left:0;white-space:nowrap}
  /* The one button that commits something. Quiet while there's nothing to save,
     solid once a round exists, ringed in gold the moment 9 or 18 holes are in —
     Kit went days without saving because nothing ever asked to be pressed. */
  #scNew{background:#fff;color:#1b3a66;border-color:#cfc3a2;font-size:12.5px;
    padding:9px 16px;letter-spacing:.4px;transition:box-shadow .18s}
  #scNew.armed{background:#fff;color:#1b3a66;border-color:#cfc3a2}   /* matches the other card buttons — no berry */
  #scNew.ready{box-shadow:0 0 0 2px #f2a413,0 0 12px rgba(242,164,19,.5)}   /* gold ring is the only nudge once 9/18 holes are in */
  #scNew.armed:active{background:#f3efe4}
  #scClose{min-width:46px;min-height:40px;font-size:20px !important;font-weight:900 !important;line-height:1;padding:6px 10px !important}
  #scbar button{touch-action:manipulation}
  #scLogoWrap{text-align:center;padding:0;pointer-events:none} /* negative logo margins overlap scbar — must not steal taps from ✕ */
  #scLogo{width:min(340px,82%);height:auto;margin:-36px 0 -42px} /* the artwork has generous transparent margins — pull them in */
  /* the card itself: white boxes ruled in light blue, like the club's printed scorecard */
  #sctab{flex:1;overflow-y:auto;padding:0 14px}
  #sctab table{width:100%;border-collapse:separate;border-spacing:0;font-size:17px;
    font-variant-numeric:tabular-nums;background:#ffffff;color:#1b3a66;
    border:1.5px solid #9fc2ea;border-radius:14px;overflow:hidden}
  #sctab th,#sctab td{padding:8px 3px;text-align:center;background:#ffffff;
    border-bottom:1px solid #bcd6f2;border-right:1px solid #e2eefb}
  #sctab th:last-child,#sctab td:last-child{border-right:none}
  #sctab tr:last-child td{border-bottom:none}
  /* overflow:hidden does NOT clip cell backgrounds on a border-collapse:separate
     table in WebKit, so the white td's squared off the rounded blue frame and
     bled past it at the corners. Round the corner cells themselves instead.
     12.5px = the table's 14px radius minus its 1.5px border. */
  #sctab table tr:first-child th:first-child{border-top-left-radius:12.5px}
  #sctab table tr:first-child th:last-child{border-top-right-radius:12.5px}
  #sctab table tr:last-child td:first-child{border-bottom-left-radius:12.5px}
  #sctab table tr:last-child td:last-child{border-bottom-right-radius:12.5px}
  #sctab th{color:#4a6ea8;font-weight:700;font-size:12px;letter-spacing:.6px}
  #sctab td:first-child,#sctab th:first-child{text-align:left;padding-left:10px}
  /* hole-by-hole card: uniform column grid, everything centered */
  #sctab table.cardt{table-layout:fixed}
  #sctab table.cardt td:first-child,#sctab table.cardt th:first-child{text-align:center;padding-left:3px}
  #sctab td small{color:#7b93b8;font-size:11px}
  #sctab tr.bl-open{cursor:pointer}
  #sctab tr.bl-open:hover td{background:#f4f8ff}
  #sctab tr.bl-open:active td{background:#e9f0fb}
  .bl-openhint{text-align:center;font-size:11px;color:#7b8aa3;margin:8px 0 2px;font-family:-apple-system,sans-serif;letter-spacing:.3px}
  #sctab tr.cur td{color:#1f5fd0;font-weight:700}
  #sctab tr.tot td{font-weight:700;border-top:2px solid #9fc2ea}
  #sctab tr[data-h]{cursor:pointer}
  #scstats{padding:10px 4px;font-size:11px;color:#867d64;text-align:center}
  #scBackup{text-align:center;padding:2px 0 6px}
  #scBackup button{background:none;border:none;color:#7b93b8;font-size:14.5px;font-weight:700;cursor:pointer;padding:9px 12px;text-decoration:underline;text-underline-offset:3px;touch-action:manipulation}
  #scBackup button:active{color:#1f5fd0}

  #gps{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px;gap:8px}
  #gps .dot{width:11px;height:11px;border-radius:50%;background:#666;display:inline-block;margin-right:7px;flex:none}
  #gps .dot.ok{background:#45dca0;box-shadow:0 0 6px rgba(69,220,160,.75)} #gps .dot.bad{background:var(--red)} #gps .dot.demo{background:#0e6b3a}   /* GPS-off dot: dark green (was brown) */
  #gps .dot.ok, #gps.live #gpsText{color:#17a06a}   /* matches the GPS mint chip */
  #gps.live{font-weight:700}
  /* status-card pills — solid colour chips, white type; muted when off, saturated + glow when active */
  #demoBtn,#elevBtn,#windBtn{border:none;color:#fff;border-radius:999px;padding:8px 16px;
    font-size:11px;font-weight:800;letter-spacing:.6px;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.22);transition:background .16s,box-shadow .16s,transform .1s;text-shadow:0 1px 1px rgba(0,0,0,.18)}
  #demoBtn:active,#elevBtn:active,#windBtn:active{transform:translateY(1px)}
  #windBtn{background:#86c8e6}                                                            /* WIND — PMS 306 cyan */
  #windBtn.on{background:#00a9e0;box-shadow:0 0 10px rgba(0,169,224,.55),0 1px 3px rgba(0,0,0,.22)}
  #elevBtn{background:#eab4d9}                                                            /* ± ELEV — PMS 238 pink */
  #elevBtn.on{background:#de5fb0;box-shadow:0 0 10px rgba(222,95,176,.55),0 1px 3px rgba(0,0,0,.22)}
  #demoBtn{background:#45dca0;color:#0b3b29;text-shadow:none}                              /* GPS ON — PMS 3385 mint (dark ink for legibility) */
  #demoBtn.on{background:#0e6b3a;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 0 10px rgba(14,107,58,.5),0 1px 3px rgba(0,0,0,.22)} /* GPS OFF — dark green */

  footer{font-size:7px;color:var(--dim);text-align:center;margin-top:16px;line-height:1.4;opacity:.35}
  footer a{color:var(--dim)}

  /* ---- memory sheet: replaces window.prompt(), which is an unstyled system
     dialog on iOS and the weakest moment in the app ---- */
  .rf-sheet{position:fixed;inset:0;z-index:96;display:none;align-items:flex-end;justify-content:center;
    background:rgba(12,14,16,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .rf-sheet.open{display:flex}
  .rf-card{background:var(--card);color:var(--text);width:min(460px,100%);border-radius:18px 18px 0 0;
    padding:18px 18px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
  @media(min-width:520px){.rf-sheet{align-items:center}.rf-card{border-radius:18px}}
  .rf-card h3{margin:0 0 2px;font-size:17px}
  .rf-card .rf-sub{font-size:12.5px;color:var(--dim);margin:0 0 12px}
  .rf-card textarea{width:100%;min-height:88px;resize:none;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;font-size:15px;line-height:1.45;background:var(--card2);color:var(--text);font-family:inherit}
  .rf-card textarea:focus{outline:none;border-color:var(--accent)}
  .rf-count{font-size:11.5px;color:var(--dim);text-align:right;margin:5px 2px 12px}
  .rf-row{display:flex;gap:9px}
  .rf-btn{flex:1;border:none;border-radius:12px;padding:12px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .rf-btn.primary{background:var(--accent);color:#fff}
  .rf-btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  /* ---- photographs on the keepsake ---- */
  #rfPhotos{margin:22px 0 4px}
  #rfPhotos h4{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#1b3a66;margin:0 0 9px;
    font-family:-apple-system,sans-serif;font-weight:800}
  #rfPhotos .rf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  #rfPhotos figure{margin:0;position:relative}
  #rfPhotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid #e0d6bd;display:block}
  #rfPhotos .rf-x{position:absolute;top:5px;right:5px;border:none;border-radius:999px;width:23px;height:23px;
    font-size:13px;line-height:1;cursor:pointer;background:rgba(16,18,20,.62);color:#fff}
  #rfPhotos .rf-add{border:1.5px dashed #c3b79a;background:transparent;border-radius:10px;aspect-ratio:4/3;width:100%;
    cursor:pointer;color:#6b6350;font-size:12.5px;font-weight:700;font-family:-apple-system,sans-serif}
  #rfPhotos .rf-budget{font-size:11px;color:#8a8270;margin-top:8px;font-family:-apple-system,sans-serif}
  #rfPhotos .rf-warn{color:#b3261e;font-weight:700}
  @media print{#rfPhotos .rf-add,#rfPhotos .rf-x,#rfPhotos .rf-budget{display:none}}
</style>
</head>

/* ============ TOPO: contours + elevation grid (USGS 3DEP) ============ */
function decodePolyline(s){
  const pts=[]; let i=0, lat=0, lng=0;
  while(i<s.length){
    for(const which of [0,1]){
      let r=0, sh=0, b;
      do{ b=s.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5; }while(b>=32);
      const v=(r&1)?~(r>>1):(r>>1);
      if(which===0) lat+=v; else lng+=v;
    }
    pts.push([lat/1e5, lng/1e5]);
  }
  return pts;
}
const TOPO = (()=>{
  if(!TOPO_DATA) return null;
  const lines = TOPO_DATA.contours.map(c=>{
    const pts=decodePolyline(c.p);
    const las=pts.map(p=>p[0]), lns=pts.map(p=>p[1]);
    return {lvl:c.l, pts, bb:[Math.min(...las),Math.min(...lns),Math.max(...las),Math.max(...lns)]};
  });
  const unb64 = g => { const bin=atob(g.b64), z=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) z[i]=bin.charCodeAt(i); return {...g, z}; };
  return {lines, grid:unb64(TOPO_DATA.grid),
          patches:(TOPO_DATA.patches||[]).map(unb64),
          indexEvery:TOPO_DATA.index_every_ft};
})();
function bilinear(g, ll){ // bilinear elevation lookup on one grid; null if outside
  const gx=(ll.lng-g.lon0)*(111320*Math.cos(ll.lat*Math.PI/180))/g.step;
  const gy=(ll.lat-g.lat0)*111320/g.step;
  const x0=Math.floor(gx), y0=Math.floor(gy);
  if(x0<0||y0<0||x0>=g.nx-1||y0>=g.ny-1) return null;
  const fx=gx-x0, fy=gy-y0, at=(x,y)=>g.zmin_ft+g.z[y*g.nx+x]*g.zscale;
  return at(x0,y0)*(1-fx)*(1-fy)+at(x0+1,y0)*fx*(1-fy)+at(x0,y0+1)*(1-fx)*fy+at(x0+1,y0+1)*fx*fy;
}
function elevFt(ll){ // 3m green-complex patches take priority over the 10m base grid
  if(!TOPO) return null;
  for(const p of TOPO.patches){ const v=bilinear(p,ll); if(v!==null) return v; }
  return bilinear(TOPO.grid, ll);
}

/* ============ GEO MATH ============ */
const M_PER_YD = 0.9144;
function yds(a, b){ // a,b: {lat,lng}
  const r = Math.PI/180, dLa=(b.lat-a.lat)*r, dLo=(b.lng-a.lng)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 6371000*2*Math.asin(Math.sqrt(h))/M_PER_YD;
}
function segDistYds(p, a, b){
  const mLat=111320, mLon=111320*Math.cos(p.lat*Math.PI/180);
  const px=(p.lng-a.lng)*mLon, py=(p.lat-a.lat)*mLat;
  const bx=(b.lng-a.lng)*mLon, by=(b.lat-a.lat)*mLat;
  const L2=bx*bx+by*by, t=L2?Math.max(0,Math.min(1,(px*bx+py*by)/L2)):0;
  return Math.hypot(px-t*bx, py-t*by)/M_PER_YD;
}
function polyRange(p, pts){ // min/max distance from p to polygon vertices
  let lo=Infinity, hi=0;
  for(const v of pts){ const d=yds(p,v); if(d<lo)lo=d; if(d>hi)hi=d; }
  return [Math.round(lo), Math.round(hi)];
}

function brg(a,b){ // compass bearing a→b, flat-earth approx (fine at course scale)
  const dx=(b.lng-a.lng)*Math.cos((a.lat+b.lat)*Math.PI/360), dy=b.lat-a.lat;
  return (Math.atan2(dx,dy)*180/Math.PI+360)%360;
}

function windYds(p,target,dist){ // adjustment in yds; + = plays longer. ~1%/mph headwind, ~0.5%/mph tailwind
  if(!windAdjust || !wind.src || wind.spd<1 || wind.dir===null) return 0;
  const hw = wind.spd*Math.cos((wind.dir-brg(p,target))*Math.PI/180); // + = headwind component
  const cl = Math.max(-30,Math.min(30,hw));
  return dist*(cl>0?0.010:0.005)*cl;
}

function startGeo(){

  const secureGeo = location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname);
  if(!secureGeo){

    p => { if(demo) return;

      gpsStatus('ok', `GPS ±${Math.round(p.coords.accuracy)}m · ${fixes.length}/5 fixes`); },
    e => { gpsStatus('bad', 'GPS unavailable — tap DEMO MODE');

function shotDists(day){ // each mark's distance: to the next mark on the same hole, else to that green's center
  // `shots` accumulates across every round ever marked. Pass a day to get one
  // round's; clubStats() wants all of them, the keepsake wants only today's —
  // without the filter the keepsake called an all-time best "Longest shot".
  const src = day ? shots.filter(q=>q.d===day) : shots;
  const out=[];
  for(let i=0;i<src.length;i++){
    const s=src[i], nx=src[i+1];
    let end=null;
    if(nx && nx.d===s.d && nx.h===s.h) end={lat:nx.lat,lng:nx.lng};
    else{ const hh=course.holes.find(x=>x.hole_number===s.h); if(hh) end=hh.green.center; }
    if(end){ const y=yds(s,end); if(y>15 && y<400) out.push({club:s.club, y}); }
  }
  return out;
}
function clubStats(){ // median carry per club, all stored rounds
  const m={};
  shotDists().forEach(r=>{ (m[r.club]=m[r.club]||[]).push(r.y); });
  return CLUBS.map(c=>{ const a=(m[c]||[]).sort((x,y)=>x-y);
    return a.length ? {club:c, n:a.length, med:Math.round(a[(a.length-1)>>1])} : null; }).filter(Boolean);
}
const DEFDIST={D:220,'3W':200,'5W':185,'3H':175,'4i':165,'5i':155,'6i':145,'7i':135,'8i':125,'9i':115,PW:105,GW:90,SW:75,LW:60};
function clubDist(club){ // learned median once trusted (n>=2), stock number until then
  const st=clubStats().find(x=>x.club===club && x.n>=2);
  return st ? st.med : (DEFDIST[club]||null);
}
function suggestClub(distYds){ // closest learned median within 25 yds, needs >=2 samples
  let best=null, bd=1e9;
  for(const s of clubStats()){ if(s.n<2) continue;
    const d=Math.abs(s.med-distYds); if(d<bd){ bd=d; best=s; } }
  return bd<=25 ? best : null;
}

function blWx(w){

    +`<text x="106" y="112" text-anchor="middle" font-family="'EB Garamond',serif" font-style="italic" font-size="14" fill="#0e5a32">the ${blOrd(moment.h.hole_number)}</text>`

let blCtx=null;   // the stored round being viewed, or null for the live round

// Render the keepsake page to a PNG and hand it to the OS share sheet. html2canvas

// somehow unavailable or fails, we fall back to Save/Print, which on a phone still
// yields a shareable PDF. So Share upgrades where it can and never breaks.
function blShareDeliver(blob, d){
  if(!blob){ window.print(); return; }
  const fname=`bears-log-${d}.png`, file=new File([blob], fname, {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:"The Bear's Log", text:"My round — kept by the WBYC Rangefinder"}).catch(()=>{});
  }else{
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);

function blShare(d){
  const page=document.querySelector('#bearlog .bl-page');
  if(!page || typeof html2canvas==='undefined'){ window.print(); return; }
  // leave interactive chrome (add-photo, budget line, remove ×, empty-note prompt)
  // out of the shared image
  const ignore=el=>el.classList && (el.classList.contains('rf-add')||el.classList.contains('rf-budget')
    ||el.classList.contains('rf-x')||(el.classList.contains('bl-note')&&el.classList.contains('empty')));
  const btn=$('blShare'); if(btn){ btn.disabled=true; btn.textContent='…'; }

}
function renderCard(){

function renderStats(){

/* ============ RENDER ============ */
function fmt(d){ return d==null ? '–' : String(Math.round(d)); }

/* ---- self-writing memory: a quiet line from past rounds on this hole ---- */
function scoreWord(d){ return d<=-3?'an albatross':d===-2?'an eagle':d===-1?'a birdie':d===0?'par':d===1?'a bogey':d===2?'a double bogey':(d+' over'); }
function renderHoleMemory(){
  const el=$('holeMemory'), h=hole(), idx=holeIdx, recs=[];
  rounds.forEach(r=>{ const e=r.holes&&r.holes[idx]; if(e&&e.s>0){ const par=(r.tee==='Red'||r.tee==='Green')?h.par_women:h.par; recs.push({s:e.s, d:e.s-par, date:r.date||''}); } });
  if(!recs.length){ el.classList.remove('on'); el.classList.remove('good'); el.textContent=''; return; }
  const ace=recs.some(x=>x.s===1), birds=recs.filter(x=>x.d<=-1).length, bestD=Math.min(...recs.map(x=>x.d));
  let t, good=true;
  if(ace) t='You have aced this hole — a legend here.';
  else if(bestD<=-2) t='You once eagled this hole.';
  else if(birds>=2) t=`You've birdied here ${birds} times.`;
  else if(birds===1) t="You've birdied here before.";
  else { recs.sort((a,b)=> a.date<b.date?-1:1); const last=recs[recs.length-1]; t=`Last time here: ${scoreWord(last.d)} (${last.s}).`; good=false; }

    $('dFront').textContent  = fmt(yds(p,g.front));
    $('dCenter').textContent = fmt(dc);
    $('dBack').textContent   = fmt(yds(p,g.back));
    // "plays like": elevation (~1 yd per 3 ft) + wind (head/tail component)
    let plays='', adj=dc, dFt=0;
    if(elevAdjust){
      const pe=elevFt(p), ge=elevFt(tgt);

    }
    const wYd=Math.round(windYds(p,tgt,dc));
    adj+=wYd;
    const grav=GRAVS[gravIdx];
    if(gravIdx>0) plays=`plays ${Math.round(adj/grav.f)} on ${grav.name}`;
    else{
      const bits=[];
      if(Math.abs(dFt)>=3) bits.push(`${dFt>0?'+':''}${dFt} ft`);
      if(Math.abs(wYd)>=1) bits.push(`wind ${wYd>0?'+':''}${wYd}`);
      if(bits.length) plays=`plays ${Math.round(adj)} (${bits.join(', ')})`;
      const sug=suggestClub(Math.round(adj)); // learned club, once SHOT marks teach it
      if(sug) plays=(plays||`plays ${Math.round(adj)}`)+` · ${sug.club}`;
    }
    $('playsLike').textContent=plays;
    // dream-mode firefly trail bookkeeping
    if(!trail.length || yds(trail[trail.length-1],p)>1){ trail.push({lat:p.lat,lng:p.lng}); if(trail.length>5) trail.shift(); }
  } else {
    $('dFront').textContent=$('dCenter').textContent=$('dBack').textContent='–';
    $('playsLike').textContent='';
  }
  renderHazards(h,p,g);
  renderMap(h,p,tb);
  renderScore();
}

function renderHazards(h,p,g){
  const rows=[];
  if(p){
    // dogleg targets: centerline vertices between tee and green
    h.centerline.slice(1,-1).forEach((v,i)=>{
      const d=yds(p,v);
      if(d>20) rows.push({sort:d, html:
        `<span><span class="ic dogleg"></span>Dogleg corner ${h.centerline.length>3?(i+1):''}</span>
         <span class="nums"><b>${Math.round(d)}</b></span>`});
    });
    h.hazards.forEach(hz=>{
      const [lo,hi]=polyRange(p,hz.points);
      if(lo>350) return; // out of relevance
      const label = hz.type==='water' ? 'Water' : 'Bunker';
      rows.push({sort:lo, html:
        `<span><span class="ic ${hz.type}"></span>${label}</span>
         <span class="nums"><b>${lo}</b> / ${hi} carry</span>`});
    });
    rows.sort((a,b)=>a.sort-b.sort);
  }
  rows.push({sort:1e9, html:
    `<span>Green depth</span><span class="nums"><b>${g.depth_yds}</b> yds</span>`});
  $('hazList').innerHTML = rows.map(r=>`<div class="hazrow">${r.html}</div>`).join('');
}


/* ---- SVG map ---- */
let mapTransform=null; // for tap-to-move inverse
let mapZoom=null, lastPinch=0; // pinch-zoom state: {k, cx, cy} in the hole's frame
function applyMapZoom(){
  if(!mapTransform) return;
  const [bx,by,bw,bh]=mapTransform.base;
  let vb=[bx,by,bw,bh];
  if(mapZoom && mapZoom.k>1.03){
    const zw=bw/mapZoom.k, zh=bh/mapZoom.k;
    const zx=Math.max(bx,Math.min(bx+bw-zw, mapZoom.cx-zw/2));
    const zy=Math.max(by,Math.min(by+bh-zh, mapZoom.cy-zh/2));
    vb=[zx,zy,zw,zh];
  } else mapZoom=null; // pinched back out — snap to the full hole
  mapTransform.svg.setAttribute('viewBox', vb.map(v=>v.toFixed(1)).join(' '));
}
function initMapGestures(){ // two-finger pinch: zoom around the fingers, drag to pan
  const wrap=$('mapwrap'), pts=new Map(); let g=null;
  wrap.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2 && mapTransform){
      const [a,b]=[...pts.values()], vb=mapTransform.svg.viewBox.baseVal;
      g={d0:Math.hypot(a[0]-b[0],a[1]-b[1])||1, vb0:[vb.x,vb.y,vb.width,vb.height],
         k0:mapTransform.base[2]/(vb.width||1)};
    }
  });
  wrap.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2 && g && mapTransform){
      const [a,b]=[...pts.values()], r=mapTransform.svg.getBoundingClientRect();
      const d=Math.hypot(a[0]-b[0],a[1]-b[1])||1, mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const k=Math.max(1,Math.min(8, g.k0*d/g.d0));
      const zw=mapTransform.base[2]/k, zh=mapTransform.base[3]/k;
      const mu=(mid[0]-r.left)/(r.width||1), mv=(mid[1]-r.top)/(r.height||1);
      const wx=g.vb0[0]+mu*g.vb0[2], wy=g.vb0[1]+mv*g.vb0[3]; // world point under the fingers
      mapZoom={k, cx:wx+(0.5-mu)*zw, cy:wy+(0.5-mv)*zh};
      lastPinch=Date.now();
      applyMapZoom();
      e.preventDefault();
    }
  },{passive:false});
  const done=e=>{ pts.delete(e.pointerId); if(pts.size<2) g=null; };
  wrap.addEventListener('pointerup',done); wrap.addEventListener('pointercancel',done);
}
function renderMap(h,p,tb){

  const GCOL={dark:['#4cc97f','#249a55','#0e6b3a'],sun:['#50cb83','#2a9d5b','#127040'],dream:['#3fd4a0','#1aa375','#0b7452']}[theme]||['#4cc97f','#249a55','#0e6b3a'];
  const WCOL={dark:['#4a7fb5','#2f5781'],sun:['#3b7cc0','#1c4a80'],dream:['#6f86ff','#3d55d6']}[theme]||['#4a7fb5','#2f5781'];
  let s='<defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'

    +`<linearGradient id="wgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${WCOL[0]}"/><stop offset="100%" stop-color="${WCOL[1]}"/></linearGradient>`
    +'<radialGradient id="ballgrad" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#ffffff"/><stop offset="65%" stop-color="#eef2ef"/><stop offset="100%" stop-color="#c7d1ca"/></radialGradient>'

    +`<filter id="gshadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="${(w*0.006).toFixed(1)}" stdDeviation="${(w*0.011).toFixed(1)}" flood-color="#06301a" flood-opacity="0.5"/></filter>`
    +'<filter id="vib"><feColorMatrix type="saturate" values="2.05"/><feComponentTransfer><feFuncR type="linear" slope="1.11" intercept="-0.035"/><feFuncG type="linear" slope="1.11" intercept="-0.035"/><feFuncB type="linear" slope="1.11" intercept="-0.035"/></feComponentTransfer></filter>'
    +'</defs>';
  const ctrD=[]; // contour path strings, reused for on-green reading lines
  const aer = AERIALS ? AERIALS.find(a=>a.hole===h.hole_number) : null;
  const satOn = satMode && !!aer && aerialsOK;
  // frame background matches the tint base so the shading reads edge-to-edge
  const bgStops=RAMPS[theme]||RAMPS.dark;
  $('mapwrap').style.background = `rgb(${bgStops[0][0]},${bgStops[0][1]},${bgStops[0][2]})`;
  // hypsometric tint: always rendered (sits under the photo in SAT so extended margins stay complete)

      // sharper tint: DPR-scaled raster (extra resolution in green view), cached per frame

      if(renderMap._tk===tintKey && renderMap._turl){
        s+=`<image href="${renderMap._turl}" x="${minX.toFixed(1)}" y="${minY.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" preserveAspectRatio="none"/>`;

      }

      s+=`<image href="${renderMap._turl}" x="${minX.toFixed(1)}" y="${minY.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" preserveAspectRatio="none"/>`;
      }

    const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
    for(let i=0;i<34;i++){
      s+=`<circle class="star" cx="${(minX+rnd()*w).toFixed(1)}" cy="${(minY+rnd()*ht).toFixed(1)}" r="${(0.7+rnd()*1.3).toFixed(1)}" fill="#dbe7ff" style="animation-delay:${(rnd()*3).toFixed(1)}s"/>`;
    }
  }
  // weather-aware flourish: a whisper of the real sky over the course (from Open-Meteo). Subtle, offline-safe (skipped when no data).
  if(weather.code!=null && !satOn){
    const wc=weather.code, seed2=(h.hole_number*40503+7)>>>0;
    let sd=seed2; const rn=()=>{ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };
    if(wc===0 && weather.day){ // clear day — a soft sun glint upper-left
      s+=`<radialGradient id="sunglint" cx="20%" cy="14%" r="34%"><stop offset="0%" stop-color="#fff7d6" stop-opacity=".5"/><stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/></radialGradient>`
        +`<rect x="${minX}" y="${minY}" width="${w}" height="${ht}" fill="url(#sunglint)" pointer-events="none"/>`;
    } else if(wc===45||wc===48){ // fog — a low drifting mist band
      s+=`<rect class="wx-mist" x="${minX}" y="${(minY+ht*0.45).toFixed(1)}" width="${w}" height="${(ht*0.4).toFixed(1)}" fill="#ffffff" opacity=".14"/>`;
    } else if([51,53,55,61,63,65,80,81,82].includes(wc)){ // rain — faint drifting streaks
      let r2='';
      for(let i=0;i<26;i++){ const x=minX+rn()*w, y=minY+rn()*ht, ln=w*0.03;
        r2+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+ln*0.25).toFixed(1)}" y2="${(y+ln).toFixed(1)}" style="animation-delay:${(rn()*2).toFixed(1)}s"/>`; }
      s+=`<g class="wx-rain" stroke="#bcd6f2" stroke-width="${(w*0.004).toFixed(2)}" stroke-linecap="round" opacity=".5">${r2}</g>`;
    } else if([71,73,75,77,85,86].includes(wc)){ // snow — drifting flakes
      let f='';
      for(let i=0;i<22;i++){ f+=`<circle class="wx-flake" cx="${(minX+rn()*w).toFixed(1)}" cy="${(minY+rn()*ht).toFixed(1)}" r="${(w*0.006*(0.6+rn())).toFixed(1)}" fill="#ffffff" style="animation-delay:${(rn()*4).toFixed(1)}s"/>`; }
      s+=`<g opacity=".7">${f}</g>`;
    }
  }
  // topo contours (USGS style: brown, heavier labeled index lines)
  if(TOPO){

        ctx.beginPath(); ctx.arc(hd[0],hd[1],4+age*14,0,6.2832); ctx.stroke();
      }
    }
    // small yardage stats pinned near the apex (fade in past mid-flight, persist after)
    if(tr.stats && k>0.45){
      const ap=proj(tr.pts[tr.apexI]);
      const al=Math.min(1,(k-0.45)/0.4);
      const right=ap[0]>cw*0.6;
      ctx.textAlign=right?'right':'left';
      const tx=ap[0]+(right?-14:14);
      const l2=[];
      if(tr.stats.plays!==tr.stats.yds) l2.push('plays '+tr.stats.plays);
      if(tr.stats.dFt) l2.push((tr.stats.dFt>0?'+':'')+tr.stats.dFt+' ft');
      if(tr.stats.wYd) l2.push('wind '+(tr.stats.wYd>0?'+':'')+tr.stats.wYd);
      if(tr.stats.club) l2.push(tr.stats.club);
      const halo=sunMode?`rgba(255,255,255,${(al*.8).toFixed(2)})`:`rgba(8,12,18,${(al*.75).toFixed(2)})`;
      ctx.lineWidth=4; ctx.lineJoin='round';
      ctx.font='700 18px system-ui,sans-serif';
      ctx.strokeStyle=halo;
      ctx.strokeText(tr.stats.yds+' yds', tx, ap[1]-9);
      ctx.fillStyle=sunMode?`rgba(190,0,150,${al.toFixed(2)})`:`rgba(255,165,235,${al.toFixed(2)})`;
      ctx.fillText(tr.stats.yds+' yds', tx, ap[1]-9);
      ctx.font='600 13px system-ui,sans-serif';
      const l2s=l2.join(' · '), l3='apex '+tr.stats.apexFt+' ft';
      ctx.fillStyle=sunMode?`rgba(45,45,55,${al.toFixed(2)})`:`rgba(232,238,246,${al.toFixed(2)})`;
      if(l2s){ ctx.strokeText(l2s, tx, ap[1]+11); ctx.fillText(l2s, tx, ap[1]+11); }
      ctx.strokeText(l3, tx, ap[1]+(l2s?28:11));
      ctx.fillText(l3, tx, ap[1]+(l2s?28:11));
      ctx.textAlign='left';
    }
  }
}
function open3D(){
  const h=hole();
  D3.holeN=holeIdx; D3.az=0; D3.el=0.95; D3.zoom=1; D3.ex=1.6;
  $('d3ex').value=1.6;
  D3.mesh=build3D(h);
  // flag position: green-classified mesh vertex nearest the green center (frame origin pre-centering)
  const m=D3.mesh; let best=null,bd=Infinity;
  for(let i=0;i<m.cls.length;i++) if(m.cls[i]===1){
    const v=m.verts[i], d=v[0]*v[0]+v[1]*v[1];
    if(d<bd){bd=d;best=v;}
  }
  D3.flagWorld=best;
  const pn3=pinFor(h); if(pn3) D3.flagWorld=D3.mesh.toWorld(pn3); // flag + tracer land on today's pin
  $('d3Title').textContent=`HOLE ${h.hole_number} · PAR ${holePar(h)} · 3D TERRAIN`;
  $('threeD').classList.add('open');
  D3.open=true;
  requestAnimationFrame(draw3D);
  startTracer(h);
  if(D3.mesh.hasWater){ // gentle shimmer loop (~18 fps), only on holes with water
    D3.lastT=0;
    const loop=ts=>{ if(!D3.open) return;
      if(ts-D3.lastT>55){ D3.lastT=ts; draw3D(); }
      requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
}
function close3D(){ $('threeD').classList.remove('open'); D3.open=false; D3.mesh=null; D3.tracer=null; }
function startTracer(h){
  D3.tracer=null;
  const m=D3.mesh; if(!m||!m.toWorld) return;
  const p=playerPos(), c=h.green.center, tb=teeBox(h);
  const holeLen=yds({lat:tb.lat,lng:tb.lng},c);
  const from=(p && yds(p,c)<holeLen*1.6+120)?p:tb; // your ball if you're on the hole, else the tee
  const a=m.toWorld(from), b=D3.flagWorld||m.toWorld(c);
  const dx=b[0]-a[0], dy=b[1]-a[1], dm=Math.hypot(dx,dy);
  if(dm<15) return; // already on the green — nothing to trace
  const apx=apexM(dm);
  let cwx=0, cwy=0; // crosswind drift, grows late in flight
  if(windAdjust && wind.src && wind.spd>=1 && wind.dir!==null){
    const br=(wind.dir+180)*Math.PI/180;            // blowing-to bearing
    const wv=m.rotV(Math.sin(br), Math.cos(br));    // into the hole frame
    const px=-dy/dm, py=dx/dm;
    const drift=(wv[0]*px+wv[1]*py)*Math.min(wind.spd,30)*0.35; // meters, capped
    cwx=px*drift; cwy=py*drift;
  }
  const pts=[];
  for(let i=0;i<=48;i++){
    const t=i/48, d2=t*t;
    pts.push([a[0]+dx*t+cwx*d2, a[1]+dy*t+cwy*d2, a[2]+(b[2]-a[2])*t+apx*arcZ(t)]);
  }
  let apexI=24, bestH=-1; // highest point of the lift profile, for stat placement
  for(let i=0;i<=48;i++){ const hh=apx*arcZ(i/48); if(hh>bestH){ bestH=hh; apexI=i; } }
  // flight stats: same math as the plays-like readout, pinned to the arc
  const dcY=yds(from,c);
  let adj=dcY, dFt=0;
  if(elevAdjust){ const pe=elevFt(from), ge=elevFt(c);
    if(pe!==null && ge!==null){ dFt=Math.round(ge-pe); adj+=dFt/3; } }
  const wYd=Math.round(windYds(from,c,dcY)); adj+=wYd;
  const sug=suggestClub(Math.round(adj));
  const stats={yds:Math.round(dcY), plays:Math.round(adj), dFt, wYd,
               club:sug?sug.club:null, apexFt:Math.round(apx/0.3048)};
  const t0=(typeof performance!=='undefined'?performance.now():Date.now());
  D3.tracer={pts, t0, dur:900+dm*2.2, apexI, stats};
  const loop=()=>{ if(!D3.open||!D3.tracer) return;
    const el2=(typeof performance!=='undefined'?performance.now():Date.now())-t0;
    draw3D();
    if(el2<D3.tracer.dur+950) requestAnimationFrame(loop); // linger for the landing pulse
  };
  requestAnimationFrame(loop);
}
function wire3D(){
  const cv=$('d3c');
  let drag=null, pinch=null;
  cv.addEventListener('pointerdown',e=>{ drag=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{
    if(!drag||!D3.open) return;
    D3.az += (e.clientX-drag[0])*0.008;
    D3.el = Math.max(0.28, Math.min(1.45, D3.el + (e.clientY-drag[1])*0.005));
    drag=[e.clientX,e.clientY];
    D3.fast=true; // coarse mesh mid-drag for smooth orbiting
    requestAnimationFrame(draw3D);
  });
  cv.addEventListener('pointerup',()=>{ drag=null;
    if(D3.open){ D3.fast=false; requestAnimationFrame(draw3D); } }); // settle at full resolution
  cv.addEventListener('wheel',e=>{ e.preventDefault();
    D3.zoom=Math.max(0.5,Math.min(3,D3.zoom*(e.deltaY<0?1.1:0.9)));
    requestAnimationFrame(draw3D); },{passive:false});
  cv.addEventListener('touchstart',e=>{ if(e.touches.length===2) pinch=Math.hypot(
    e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); },{passive:true});
  cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    D3.zoom=Math.max(0.5,Math.min(3,D3.zoom*d/pinch)); pinch=d;
    requestAnimationFrame(draw3D); } },{passive:true});
  $('d3Close').onclick=close3D;
  $('d3Trace').onclick=()=>{ if(D3.open) startTracer(hole()); };
  $('d3ex').addEventListener('input',e=>{ D3.ex=+e.target.value; requestAnimationFrame(draw3D); });
  window.addEventListener('resize',()=>{ if(D3.open) requestAnimationFrame(draw3D); });
}

/* tap-to-move in demo mode */
function mapTap(ev){
  if(!mapTransform) return;
  if(Date.now()-lastPinch<400) return; // settling fingers after a pinch aren't a tap
  const svg=mapTransform.svg, r=svg.getBoundingClientRect();
  const vb=svg.viewBox.baseVal;
  const X=vb.x + (ev.clientX-r.left)/r.width*vb.width;
  const Y=vb.y + (ev.clientY-r.top)/r.height*vb.height;
  const ll=mapTransform.unrot(X,Y);
  if(pinArm){ // this tap drops today's pin instead of moving the player
    const h=hole();
    if(yds(ll, h.green.center) <= 60){
      freshPins();
      pins.p[h.hole_number]={lat:ll.lat, lng:ll.lng}; savePins();
      pinArm=false; render();
      $('maphint').textContent='⛳ pin set for today';
    } else $('maphint').textContent='closer to the green, please';
    return;
  }
  const hM=hole();
  if(memArm){ // this tap pins a memory at the tapped spot
    rfOpenMemorySheet(ll, hM.hole_number); const note=null;
    if(note && note.trim()){
      memories.push({h:hM.hole_number, lat:+ll.lat.toFixed(6), lng:+ll.lng.toFixed(6), note:note.trim().slice(0,140), date:new Date().toISOString().slice(0,10)});
      saveMemories(); $('maphint').textContent='★ memory pinned';
    }
    memArm=false; $('memBtn').classList.remove('on'); render();
    return;
  }
  { // tap on (near) an existing memory star to read or remove it
    const cand=memories.filter(m=>m.h===hM.hole_number).map(m=>({m,d:yds(ll,m)})).sort((a,b)=>a.d-b.d)[0];
    if(cand && cand.d<=14){ const m=cand.m;
      if(confirm(`“${m.note}”\n— pinned ${m.date}\n\nRemove this memory?`)){ memories=memories.filter(x=>x!==m); saveMemories(); render(); }
      return;
    }
  }
  if(!demo){
    if(pos) return;              // GPS is live — ignore stray taps so the ball stays locked on you
    setDemo(true,'tap');         // no GPS fix yet — a tap enters demo so you can position by hand
  }
  demoPos=ll;
  // easter egg: land the tap on the pin (≤3 yds) on all 18 holes
  if(yds(demoPos, hole().green.center) <= 3){
    aced.add(hole().hole_number);
    $('maphint').textContent = aced.size===18 ? '⛳ A PERFECT 18!' : `⛳ hole-in-one! (${aced.size}/18)`;
    if(aced.size===18) confetti();
  }
  render();
}
function confetti(){
  if(document.getElementById('confetti')) return;
  const d=document.createElement('div'); d.id='confetti';
  let html='';
  for(let i=0;i<44;i++)
    html+=`<b style="left:${(Math.random()*100).toFixed(1)}vw;animation-delay:${(Math.random()*1.6).toFixed(2)}s"></b>`;
  d.innerHTML=html;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 6500);
}

let theme = (() => {
  const saved = localStorage.getItem('wbyc_theme');
  if (['dark','sun','dream'].includes(saved)) return saved;
  const h = new Date().getHours();
  return (h >= 10 && h < 17) ? 'sun' : 'dark';
})();
let sunMode = theme === 'sun'; // kept in sync by applyTheme
const RAMPS = { // bright, saturated 'lush' greens
  sun:   [[246,252,240],[170,236,190],[96,196,136]], // 3-stop: daytime relief reads (low=deep, high=pale)
  dark:  [[68,202,128],[168,255,197]],
  dream: [[10,12,42],[20,110,130],[152,52,192]]  // aurora: indigo → teal → magenta
};
const rampCol = (stops, t) => {
  const n = stops.length-1, seg = Math.min(n-1, Math.floor(t*n)), f = t*n-seg;
  return [0,1,2].map(k => stops[seg][k]+(stops[seg+1][k]-stops[seg][k])*f);
};
function applyTheme(){
  sunMode = theme === 'sun';
  document.body.classList.toggle('sun', theme==='sun');
  document.body.classList.toggle('dream', theme==='dream');
  $('sunBtn').textContent = theme==='dark' ? '☀' : theme==='sun' ? '✦' : '☾';
  $('sunBtn').title = theme==='dark' ? 'Sunlight mode' : theme==='sun' ? 'Dream mode' : 'Dark mode';
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.content = theme==='sun' ? '#f7f5f0' : theme==='dream' ? '#0b0b2a' : '#0e1512';
}
function initTheme(){
  applyTheme();
  $('sunBtn').onclick = () => {
    theme = theme==='dark' ? 'sun' : theme==='sun' ? 'dream' : 'dark';
    localStorage.setItem('wbyc_theme', theme);
    applyTheme();
    if(course) render(); // re-render so tint/contours match the theme
  };
}

/* ============ PWA: service worker + screen wake lock ============ */
function initPwa(){
  const secure = location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname);
  if(secure && 'serviceWorker' in navigator)
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  let wl=null;
  const keepAwake = async ()=>{ try{
    if('wakeLock' in navigator){ wl=await navigator.wakeLock.request('screen');
      $('gpsText').title='screen wake lock active'; }
  }catch(e){} };
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
  keepAwake();
}

/* prefer live JSON when served over http(s); embedded copy otherwise */

  init(data);

/* ============ MEMORY SHEET + KEEPSAKE PHOTOGRAPHS ============ */
/* The note used to be captured with window.prompt() — a system dialog that
   can't be styled and looks broken on iOS. Same data, better door. */
let rfPend = null;
function rfOpenMemorySheet(ll, holeNumber){
  rfPend = {ll:ll, hole:holeNumber};
  const t=$('rfMemText'); t.value=''; $('rfMemCount').textContent='0';
  $('rfMemSheet').classList.add('open');
  setTimeout(()=>t.focus(), 60);
}
function rfCloseMemorySheet(){ $('rfMemSheet').classList.remove('open'); rfPend=null; }
function rfCommitMemory(){
  const t=$('rfMemText').value.trim();
  if(t && rfPend){
    memories.push({h:rfPend.hole, lat:+rfPend.ll.lat.toFixed(6), lng:+rfPend.ll.lng.toFixed(6),
                   note:t.slice(0,140), date:new Date().toISOString().slice(0,10)});
    saveMemories(); render();
  }
  rfCloseMemorySheet();
}

/* Photographs attached to a round. Stored as compressed data URIs in
   localStorage, which is a ~5MB budget shared with rounds, shots and clubs —
   hence the 900px/q0.62 downscale, the per-round cap, the visible budget and an
   explicit quota failure. IndexedDB is the durable answer when this fills. */
const RF_PHOTO_KEY='wbyc_photos', RF_MAXEDGE=900, RF_QUALITY=0.62, RF_CAP=4;
function rfLoadPhotos(){ try{ return JSON.parse(localStorage.getItem(RF_PHOTO_KEY))||{}; }catch(e){ return {}; } }
function rfSavePhotos(o){ localStorage.setItem(RF_PHOTO_KEY, JSON.stringify(o)); }
function rfStorageKB(){ let n=0; for(const k in localStorage) if(localStorage.hasOwnProperty(k)) n+=localStorage[k].length; return Math.round(n/1024); }
function rfShrink(file, cb){
  if(typeof FileReader==='undefined'){ cb(null); return; }
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const s=Math.min(1, RF_MAXEDGE/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',RF_QUALITY)); };
    img.onerror=()=>cb(null); img.src=fr.result; };
  fr.onerror=()=>cb(null); fr.readAsDataURL(file);
}
function rfAddPhoto(uri, day){
  const all=rfLoadPhotos(), d=day||today();
  all[d]=all[d]||[];
  if(all[d].length>=RF_CAP) return 'cap';
  all[d].push(uri);
  try{ rfSavePhotos(all); }catch(e){ return 'full'; }
  return 'ok';
}
function rfRemovePhoto(i, day){
  const all=rfLoadPhotos(), d=day||today();
  if(!all[d]) return; all[d].splice(i,1);
  try{ rfSavePhotos(all); }catch(e){}
}
function rfRenderPhotos(){
  const log=$('bearlog'); if(!log||!log.classList.contains('open')) return;
  const foot=log.querySelector('.bl-foot'); if(!foot) return;
  let wrap=$('rfPhotos');
  if(!wrap){ wrap=document.createElement('div'); wrap.id='rfPhotos'; foot.parentNode.insertBefore(wrap, foot); }
  const pd=blActiveDate();   // photos belong to the round on screen (today, or a reopened one)
  const list=(rfLoadPhotos()[pd])||[], kb=rfStorageKB(), tight=kb>3600;
  // Writing innerHTML here is a subtree mutation the observer would see, re-firing
  // rfRenderPhotos forever \u2014 that self-loop rebuilt the button on every tick, so a
  // click's mousedown and mouseup landed on different nodes and never registered.
  // Detach while we write, then reattach.
  if(rfLogObs) rfLogObs.disconnect();
  wrap.innerHTML='<h4>The Photographs</h4><div class="rf-grid">'
    + list.map((src,i)=>`<figure><img src="${src}" alt=""><button class="rf-x" data-i="${i}" aria-label="Remove">\u00d7</button></figure>`).join('')
    + (list.length<RF_CAP ? '<button class="rf-add" id="rfAdd">+ add a photograph</button>' : '')
    + '</div><div class="rf-budget'+(tight?' rf-warn':'')+'">'
    + list.length+' of '+RF_CAP+' \u00b7 '+kb+'KB of roughly 5000KB used'+(tight?' \u2014 running low':'')+'</div>';
  const add=$('rfAdd'); if(add) add.onclick=()=>$('rfPhotoInput').click();
  wrap.querySelectorAll('.rf-x').forEach(b=>{ b.onclick=()=>{ rfRemovePhoto(+b.dataset.i, pd); rfRenderPhotos(); }; });
  if(rfLogObs) rfLogObs.observe(log,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
}
function wireMemoryAndPhotos(){
  // Defensive: the DOM-stub harness has no textarea, FileReader or
  // MutationObserver. Wiring must degrade quietly rather than throw, or one
  // missing browser API takes the whole app down at init.
  const t=$('rfMemText'); if(!t || !t.addEventListener) return;
  t.addEventListener('input', ()=>{ $('rfMemCount').textContent=t.value.length; });
  $('rfMemCancel').onclick=rfCloseMemorySheet;
  $('rfMemSave').onclick=rfCommitMemory;
  $('rfMemSheet').addEventListener('click', e=>{ if(e.target===$('rfMemSheet')) rfCloseMemorySheet(); });
  const inp=$('rfPhotoInput');
  if(inp && inp.addEventListener) inp.addEventListener('change', ()=>{
    const f=inp.files&&inp.files[0]; inp.value='';
    if(!f) return;
    rfShrink(f, uri=>{
      if(!uri){ alert('That image could not be read.'); return; }
      const r=rfAddPhoto(uri, blActiveDate());
      if(r==='cap') alert(RF_CAP+' photographs per round \u2014 that\'s the limit for now.');
      else if(r==='full') alert('Storage is full, so that photograph was not saved.\n\nPhotographs share about 5MB with your rounds, shots and clubs.');
      else rfRenderPhotos();
    });
  });
  const log=$('bearlog');
  if(log && typeof MutationObserver!=='undefined'){
    rfLogObs=new MutationObserver(()=>setTimeout(rfRenderPhotos,0));
    rfLogObs.observe(log,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  }
}
